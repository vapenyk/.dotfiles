# ~/.config/pkg/packages/arch-base.toml

[group]
display = "Base"
description = "Arch Linux after install"
priority = 0

[pacman]
packages = [
    "aria2",
    "base-devel",
    "bash-completion",
    "btop",
    "curl",
    "fastfetch",
    "fzf",
    "git",
    "git-lfs",
    "jq",
    "less",
    "micro",
    "mise",
    "nano",
    "rbw",
    "starship",
    "unzip",
    "wtype",
    "zip",

    # build tools
    "meson",
    "ninja",

    # audio
    "libpulse",
    "pipewire",
    "pipewire-pulse",
    "wireplumber",

    # network and bluetooth
    "bluez",
    "bluez-utils",
    "networkmanager",

    # power and brightness
    "brightnessctl",
    "power-profiles-daemon",
    "upower",

    # for ruby compile
    "libyaml",

    # for appimage run
    "fuse2",

    # misc
    "evtest",
    "ollama-vulkan",
    "powertop",
    "python-huggingface-hub",
    "wev",
]

