# ~/.config/pkg/packages/hyprland.toml

[group]
display = "Hyprland desktop"
description = "Hyprland + uwsm + Quickshell, file manager and core apps"
priority = 20

[pacman]
packages = [
    # Hyprland session
    "hyprland",
    "libinput-tools",
    "polkit",
    "uwsm",
    "vulkan-tools",
    "wayland-utils",
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-hyprland",
    "xdg-utils",

    # shell and login screen
    "gnome-keyring",
    "libsecret",
    "quickshell",
    "seahorse",

    # quick capture
    "ffmpeg",
    "gpu-screen-recorder",
    "gtk4-layer-shell",
    "imagemagick",
    "img2pdf",
    "tesseract",
    "wf-recorder",
    "zbar",

    # screenshots
    "grim",
    "hyprpicker",
    "jq",
    "satty",
    "slurp",
    "wl-clipboard",

    # clipboard history, notifications, media keys, sounds
    "playerctl",
    "sound-theme-freedesktop",

    # qt6
    "qt6-base",
    "qt6-declarative",
    "qt6-multimedia",
    "qt6-svg",
    "qt6-tools",
    "qt6-wayland",

    # apps
    "artcraft-launcher-bin",
    "chromium",
    "foot",
    "ghostty",
    "imv",
    "mpv",
    "nautilus",
    "nwg-look",
    "peazip",
    "telegram-desktop",
    "udiskie",
    "zed",

    # small things that are painful to live without
    "adwaita-cursors",
    "adwaita-fonts",
    "adwaita-icon-theme",
    "noto-fonts",
    "noto-fonts-emoji",
    "ttf-iosevka-nerd",
    "ttf-jetbrains-mono-nerd",
    "ttf-material-symbols-variable",
    "ttf-nerd-fonts-symbols",
    "xdg-user-dirs",
]

[paru]
packages = [
    # terminal launcher (reads ~/.config/xdg-terminals.list)
    "xdg-terminal-exec",

    "t3code-bin",
    "ttf-roboto-flex",
    "vesktop-bin",
    "vicinae-bin",
]
